<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - RecycleHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <i class="fa-solid fa-recycle logo-icon"></i>
                <div class="logo-text">
                    <span class="brand-name">RecycleHub</span>
                    <span class="brand-tagline">Smart Resale System</span>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="products.html"><i class="fa-solid fa-box"></i> Products</a></li>
                <li><a href="add-product.html"><i class="fa-solid fa-plus-circle"></i> Add Product</a></li>
                <li><a href="about.html"><i class="fa-solid fa-circle-info"></i> About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Form Section -->
    <main class="container mt-30 mb-60">
        <div class="form-container">
            <div class="form-header">
                <div class="form-icon-circle edit-icon">
                    <i class="fa-solid fa-pen"></i>
                </div>
                <div class="form-title-group">
                    <h2>Edit Product</h2>
                    <p>Update your product details.</p>
                </div>
            </div>

            <form class="product-form" action="#" method="POST">
                
                <div class="form-row">
                    <div class="form-group third-width">
                        <label for="productName">Product Name</label>
                        <input type="text" id="productName" value="Reusable Bottle" required>
                    </div>
                    <div class="form-group third-width">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Furniture">Furniture</option>
                            <option value="Plastic" selected>Plastic</option>
                            <option value="Books">Books</option>
                            <option value="Sports">Sports</option>
                            <option value="Electronics">Electronics</option>
                        </select>
                    </div>
                    <div class="form-group third-width">
                        <label for="price">Price (৳)</label>
                        <input type="number" id="price" value="50" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="sellerName">Seller Name</label>
                        <input type="text" id="sellerName" value="Karim" required>
                    </div>
                    <div class="form-group half-width">
                        <label for="condition">Condition</label>
                        <select id="condition" required>
                            <option value="Used">Used</option>
                            <option value="Reusable" selected>Reusable</option>
                            <option value="New">New</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" required>Clean and reusable plastic bottle. Good for daily use and helpful for reducing plastic waste.</textarea>
                </div>

                <div class="form-group full-width">
                    <div class="image-edit-section">
                        <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&q=80&w=200" alt="Current Product Image" class="current-image">
                        <button type="button" class="btn btn-outline btn-change-image"><i class="fa-solid fa-camera"></i> Change Image</button>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="product-details.html" class="btn btn-outline-light"><i class="fa-solid fa-xmark" style="display:none;"></i> Cancel</a>
                    <button type="submit" class="btn btn-solid-dark"><i class="fa-solid fa-floppy-disk"></i> Update Product</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="logo">
                <i class="fa-solid fa-recycle logo-icon"></i>
                <div class="logo-text">
                    <span class="brand-name">RecycleHub</span>
                    <span class="brand-tagline">Reduce Waste. Reuse More.</span>
                </div>
            </div>
            <div class="footer-links-wrapper">
                <ul class="footer-links">
                    <li><a href="index.html">Home</a></li>
                    <li>|</li>
                    <li><a href="products.html">Products</a></li>
                    <li>|</li>
                    <li><a href="add-product.html">Add Product</a></li>
                    <li>|</li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </div>
        </div>
    </footer>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/form-handler.js"></script>

</body>
</html>
